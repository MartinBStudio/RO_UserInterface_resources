<rml>
    <head>
        <title>Scoreboard</title>

        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_window.css" />

        <style>
            body {
                width: 1065dp;
                height: 580dp;
            }

            #scoreboard {
                padding-left: 10dp;
                width: 1050dp;
            }

            #headers {
                display: flex;
                height: 36dp;
                text-align: center;
                color: #e6b903;
                font-weight: bold;
                margin-bottom: 15dp;
            }

            #headers-left {
                width: 235dp; /* 150dp col + 85dp col */
                flex: none;
            }

            #headers-center {
                display: flex;
                overflow-x: hidden;
                max-width: 680dp; /* 85dp x 8 cols */
            }

            #headers-right {
                flex: none;
            }

            #data-container {
                overflow-y: scroll;
                height: 475dp;
            }

            #data {
                display: flex;
                text-align: center;
                padding-bottom: 10dp;
            }

            #data-left {
                width: 235dp; /* 150dp col + 85dp col */
                display: flex;
                flex-direction: column;
                flex: none;
            }

            #data-left:first-child > span {
                text-align: left;
            }

            #data-center {
                overflow-x: auto;
                height: 460dp;
                max-width: 680dp; /* 85dp x 8 cols */
            }

            #data-right {
                flex: none;
            }

            .header-row {
                height: 36dp;
                display: flex;
                vertical-align: center;
            }

            .data-row {
                display: flex;
                flex-direction: row;
                vertical-align: middle;
                height: 28dp;
            }

            .data-row-selected {
                background-color: rgba(230, 185, 3, 70);
            }

            .header-val,
            .data-val {
                height: auto;
                width: 85dp;
                margin: 0;
                padding: 0;
                flex-shrink: 0;
            }

            .data-val-wide,
            .header-val-wide {
                width: 150dp;
                text-align: left;
            }

            .header-val span,
            .data-val span {
                vertical-align: center;
            }

            .header-val:hover {
                cursor: hand;
                color: #f7d75a;
            }

            hr {
                opacity: 0.2;
                width: 100%;
                color: #222;
                margin: auto;
            }

            #teams {
                height: 22dp;
                margin-top: 5dp;
            }

            .team-btn {
                border-top: 2dp #555;
                border-left: 2dp #555;
                border-right: 2dp #555;
                border-top-left-radius: 4dp;
                border-top-right-radius: 4dp;
                padding: 4dp 15dp;
                height: 20dp;
                margin-right: 2dp;
            }

            .team-btn:hover {
                background-color: #333;
            }

            .team-btn-selected {
                border-top: 2dp #b22c00;
                border-left: 2dp #b22c00;
                border-right: 2dp #b22c00;
            }

            /* ===== ice theme ===== */
            #ui_gamearena_scoreboard #window-content { padding: 6dp; }
            /* team tabs = ice tab buttons, selected gold */
            #ui_gamearena_scoreboard #teams { height: 26dp; margin-top: 2dp; }
            #ui_gamearena_scoreboard .team-btn {
                display: inline-block;
                height: 24dp; line-height: 24dp;
                padding: 0dp 14dp;
                margin-right: 4dp;
                border-width: 0dp;
                border-radius: 0dp;
                decorator: tiled-horizontal(ice-tab-l, ice-tab-c, ice-tab-r);
                color: rgb(30, 62, 112);
                font-weight: 820;
                font-effect: none;
            }
            #ui_gamearena_scoreboard .team-btn:hover {
                background-color: rgba(0, 0, 0, 0);
                decorator: tiled-horizontal(ice-tab-hover-l, ice-tab-hover-c, ice-tab-hover-r);
            }
            #ui_gamearena_scoreboard .team-btn-selected,
            #ui_gamearena_scoreboard .team-btn-selected:hover {
                border-width: 0dp;
                decorator: tiled-horizontal(ice-tab-sel-l, ice-tab-sel-c, ice-tab-sel-r);
                color: rgb(92, 50, 8);
            }
            /* column headers */
            #ui_gamearena_scoreboard #headers { color: rgb(30, 62, 112); margin-bottom: 6dp; font-effect: none; }
            #ui_gamearena_scoreboard .header-val:hover { color: rgb(170, 100, 20); }
            #ui_gamearena_scoreboard hr { opacity: 1; color: rgb(196, 218, 238); background-color: rgb(196, 218, 238); height: 1dp; }
            /* score table in a light ice box */
            #ui_gamearena_scoreboard #data-container {
                height: 462dp;
                margin-top: 4dp;
                padding-top: 4dp;
                background-color: rgb(236, 244, 251);
                border: 1dp rgb(176, 206, 232);
                border-radius: 8dp;
                color: rgb(36, 58, 98);
                font-effect: none;
            }
            #ui_gamearena_scoreboard .data-row { border-bottom: 1dp rgb(220, 232, 244); }
            #ui_gamearena_scoreboard .data-row-selected { background-color: rgb(255, 244, 214); color: rgb(150, 92, 20); }
        </style>
        <link type="text/rcss" href="../styles/ice_sprites_dark.css" />
        <link type="text/rcss" href="../styles/dark/gamearena_scoreboard.css" />
    </head>
    <body id="ui_gamearena_scoreboard" template="window-fixed-size">
        <!-- Content-->
        <div id="scoreboard" data-model="gamearena_scoreboard_data">
            <!-- Teams -->
            <div id="teams">
                <a
                    class="team-btn"
                    index="-1"
                    data-class-team-btn-selected="selected_team_id == -1"
                    onclick="scoreboard_select_team"
                >
                    <str string-id="1068">All</str>
                </a>
                <a
                    class="team-btn"
                    data-for="team: teams"
                    data-attr-index="team.id"
                    data-class-team-btn-selected="selected_team_id == team.id"
                    onclick="scoreboard_select_team"
                >
                    {{ team.name }}
                </a>
            </div>

            <hr style="margin-bottom: 15dp" />

            <!-- Headers-->
            <div id="headers">
                <div id="headers-left" class="header-row">
                    <div
                        class="header-val"
                        data-class-header-val-wide="header_idx == 0"
                        data-for="header, header_idx: headers_left"
                        data-attr-index="header.col_idx"
                        onclick="scoreboard_sort"
                    >
                        <span>{{ header.name }}</span>
                    </div>
                </div>
                <sticky-scroll
                    id="headers-center"
                    class="header-row"
                    target="#data-center"
                    sync-scroll-left="true"
                >
                    <div
                        class="header-val"
                        data-for="header, header_idx: headers_center"
                        data-attr-index="header.col_idx"
                        onclick="scoreboard_sort"
                    >
                        <span>{{ header.name }}</span>
                    </div>
                </sticky-scroll>
                <div id="headers-right" class="header-row">
                    <div
                        class="header-val"
                        data-for="header, header_idx: headers_right"
                        data-attr-index="header.col_idx"
                        onclick="scoreboard_sort"
                    >
                        <span>{{ header.name }}</span>
                    </div>
                </div>
            </div>

            <hr />

            <!-- Data-->
            <div id="data-container">
                <div id="data">
                    <div id="data-left">
                        <div
                            class="data-row"
                            data-for="data: scores_left"
                            data-if="selected_team_id == -1 || data.team_id == selected_team_id"
                            data-class-data-row-selected="data.highlight"
                        >
                            <div
                                class="data-val"
                                data-class-data-val-wide="it_index == 0"
                                data-for="score: data.scores"
                            >
                                <span>{{ score }}</span>
                            </div>
                        </div>
                    </div>
                    <sticky-scroll
                        id="data-center"
                        target="#data-container"
                        sticky-top="true"
                        sync-scroll-top="true"
                    >
                        <div
                            class="data-row"
                            data-for="data: scores_center"
                            data-if="selected_team_id == -1 || data.team_id == selected_team_id"
                        >
                            <div
                                class="data-val"
                                data-for="score: data.scores"
                                data-class-data-row-selected="data.highlight"
                            >
                                <span>{{ score }}</span>
                            </div>
                        </div>
                    </sticky-scroll>
                    <div id="data-right">
                        <div
                            class="data-row"
                            data-for="data: scores_right"
                            data-if="selected_team_id == -1 || data.team_id == selected_team_id"
                            data-class-data-row-selected="data.highlight"
                        >
                            <div class="data-val" data-for="score: data.scores">
                                <span>{{ score }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="ice-fx ice-tl"></div>
        <div class="ice-fx ice-br"></div>
    </body>
</rml>
