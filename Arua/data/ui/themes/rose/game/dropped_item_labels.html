<rml>
    <head>
        <title>Dropped Items</title>
        <link type="text/rcss" href="../styles/html.css" />
        <link type="text/rcss" href="../styles/components.css" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/lf_rules.css" />
        <style>
            body { z-index: -100; }
            .dropped-item { position: absolute; display: inline-block; box-sizing: border-box; width: auto; max-width: 100vw; max-height: 100vh; overflow: hidden; padding: 2dp 8dp; white-space: nowrap; pointer-events: none; background-color: rgba(0, 0, 0, 0); border-radius: 0dp; }
            /* loot filter (Options > Loot Filter) */
            .lf-hidden { display: none; }
            /* loot beams: drawn behind the labels, tinted per list colour */
            /* v4: the glow for listed names comes from ../styles/lf_rules.css (written on Save, loaded at game start) */
            .lf-beam-wrap { display: none; position: absolute; left: 4dp; bottom: 20dp; width: 0; height: 0; z-index: -1; pointer-events: none; }
            .lf-beam, .lf-core, .lf-shine, .lf-base { position: absolute; pointer-events: none; }
            .lf-beam { left: -24dp; bottom: 0; width: 48dp; height: 210dp; decorator: image(ice-beam); }
            .lf-core { left: -7dp; bottom: 0; width: 14dp; height: 200dp; decorator: image(ice-beam); image-color: rgb(255, 255, 255); }
            .lf-shine { left: -15dp; bottom: 10dp; width: 30dp; height: 60dp; decorator: image(ice-beam-shine); image-color: rgb(255, 255, 255); transform: translateY(0dp); }
            .lf-base { left: -45dp; bottom: -14dp; width: 90dp; height: 28dp; decorator: image(ice-beam-base); }

            @keyframes lf-pulse { from { opacity: 0.6; } to { opacity: 1; } }
            @keyframes lf-pulse-core { from { opacity: 0.35; } to { opacity: 0.65; } }
            @keyframes lf-shine {
                0% { transform: translateY(0dp); opacity: 0; }
                15% { opacity: 1; }
                80% { opacity: 0.85; }
                100% { transform: translateY(-160dp); opacity: 0; }
            }
            /* per-list tint + glow, in rarity order: a name in two lists gets the rarer (later) one */
            .dropped-item { font-size: 15dp; }
            /* "Only show filtered drops": unmatched labels hidden by class, no extra name checks */
            .lf-only .dropped-item { display: none; }
            /* Dim other drops: unmatched labels at 50% */
            .lf-dim .dropped-item { opacity: 0.5; }
            /* rainbow: text and beam cycle through the colours */
            @keyframes lf-rainbow-text {
                0% { color: rgb(255, 110, 110); }
                17% { color: rgb(255, 180, 80); }
                33% { color: rgb(255, 240, 100); }
                50% { color: rgb(120, 235, 120); }
                67% { color: rgb(110, 200, 255); }
                83% { color: rgb(200, 140, 255); }
                100% { color: rgb(255, 110, 110); }
            }
            @keyframes lf-rainbow-beam {
                0% { image-color: rgb(255, 110, 110); }
                17% { image-color: rgb(255, 180, 80); }
                33% { image-color: rgb(255, 240, 100); }
                50% { image-color: rgb(120, 235, 120); }
                67% { image-color: rgb(110, 200, 255); }
                83% { image-color: rgb(200, 140, 255); }
                100% { image-color: rgb(255, 110, 110); }
            }
            .pickup-status { margin-left: 4dp; color: rgb(255, 80, 80); pointer-events: none; }
            .pickup-status.available { color: rgb(90, 230, 110); }
        </style>
        <script>
-- Loot filter core (inlined into both dropped_item_labels.html and options_bgfx.html)
local LF = {}
LF.file = 'loot_filter.txt'
-- lists in the game's rarity order (normal -> rarest); rarer lists win when a name is in two
LF.order = { 'yellow', 'blue', 'purple', 'red', 'green', 'rainbow' }
LF.priority = { 'rainbow', 'green', 'red', 'purple', 'blue', 'yellow' }
LF.colors = {
    yellow = 'rgb(255, 226, 84)',
    blue = 'rgb(150, 230, 255)',
    purple = 'rgb(205, 140, 255)',
    red = 'rgb(255, 96, 96)',
    green = 'rgb(120, 235, 120)',
    rainbow = 'animated',
}
LF.defaults = { yellow = '', blue = '', purple = '', red = '', green = '', rainbow = '' }
LF.io_ok = (io ~= nil and io.open ~= nil)

function LF.split(text)
    local out = {}
    for part in (text or ''):gmatch('[^,]+') do
        local name = part:match('^%s*(.-)%s*$')
        if name ~= '' then out[#out + 1] = name end
    end
    return out
end

function LF.load()
    local lists = {}
    for k, v in pairs(LF.defaults) do lists[k] = v end
    if not LF.io_ok then return lists end
    local f = io.open(LF.file, 'r')
    if not f then return lists end
    for line in f:lines() do
        local key, value = line:match('^%s*([%a_]+)%s*=(.*)$')
        if key and LF.colors[key] then lists[key] = value end
        if key == 'only_filtered' then lists.only_filtered = value:match('^%s*1') ~= nil end
        if key == 'dim_others' then lists.dim_others = value:match('^%s*1') ~= nil end
        if key == 'name_size' then lists.name_size = tonumber(value:match('%d')) end
    end
    f:close()
    return lists
end

function LF.save(lists)
    if not LF.io_ok then return false, 'file access is not available in this client' end
    local f, err = io.open(LF.file, 'w')
    if not f then return false, tostring(err) end
    for _, key in ipairs(LF.order) do f:write(key, '=', lists[key] or '', '\n') end
    f:write('only_filtered=', lists.only_filtered and '1' or '0', '\n')
    f:write('dim_others=', lists.dim_others and '1' or '0', '\n')
    f:write('name_size=', tostring(lists.name_size or 2), '\n')
    f:close()
    return true
end

-- css rules (v5): each listed name becomes a style rule on the label's bound lf-name attribute,
-- so the glow follows the name in the same frame the game writes it. Loaded at game start.
-- One rule set per saved profile (tag lfp-HASH on the label list) plus the plain lists
-- (tag lfp-none): switching to a profile the game loaded at start only swaps the tag = instant.
LF.css_file = 'data/ui/themes/rose/styles/lf_rules.css'
LF.profiles_file = 'loot_filter_profiles.txt'

-- profiles file: optional "active=Name" line, then "[Name]" sections with key=value lines
function LF.load_profiles()
    local list, by, active = {}, {}, nil
    if not LF.io_ok then return list, by, active end
    local f = io.open(LF.profiles_file, 'r')
    if not f then return list, by, active end
    local cur = nil
    for line in f:lines() do
        local sec = line:match('^%s*%[(.-)%]%s*$')
        if sec then
            cur = {}
            for _, k in ipairs(LF.order) do cur[k] = '' end
            if not by[sec] then list[#list + 1] = sec end
            by[sec] = cur
        else
            local key, value = line:match('^%s*([%a_]+)%s*=(.*)$')
            if key == 'active' and not cur then active = value:match('^%s*(.-)%s*$')
            elseif key and cur and LF.colors[key] then cur[key] = value end
        end
    end
    f:close()
    if active and not by[active] then active = nil end
    return list, by, active
end

function LF.hash(text)
    local h = 5381
    for i = 1, #text do h = (h * 33 + text:byte(i)) % 1000000007 end
    return tostring(h)
end

function LF.sig(lists)
    local parts = {}
    for i, k in ipairs(LF.order) do parts[i] = lists[k] or '' end
    return LF.hash(table.concat(parts, '|'))
end

function LF.pclass(name)
    if not name then return 'lfp-none' end
    return 'lfp-' .. LF.hash(name)
end

local function css_block(out, lists, tag)
    local R = '#dropped-item-labels-root.' .. tag
    out[#out + 1] = '/* set ' .. tag .. ' ' .. LF.sig(lists) .. ' */'
    local all, per = {}, {}
    for _, key in ipairs(LF.order) do
        local names = {}
        for _, n in ipairs(LF.split(lists[key])) do
            n = (n:gsub('["\\]', ''))
            if n ~= '' then
                names[#names + 1] = n
                all[#all + 1] = n
            end
        end
        per[key] = names
    end
    local function rule(names, pre, suf, body)
        if #names == 0 then return end
        local parts = {}
        for i, n in ipairs(names) do
            parts[i] = R .. pre .. ' .dropped-item[lf-name="' .. n .. '"]' .. suf
        end
        out[#out + 1] = table.concat(parts, ',\n') .. ' { ' .. body .. ' }'
    end
    local pulse = 'animation: 1.3s sine-in-out infinite alternate lf-pulse;'
    rule(all, '', '', 'overflow: visible; font-size: 22dp;')
    rule(all, '.lf-sz1', '', 'font-size: 18dp;')
    rule(all, '.lf-sz0', '', 'font-size: 15dp;')
    rule(all, '', ' .lf-beam-wrap', 'display: block;')
    rule(all, '', ' .lf-text', 'color: rgb(255, 255, 255);')
    rule(all, '', ' .lf-beam', pulse)
    rule(all, '', ' .lf-base', pulse)
    rule(all, '', ' .lf-core', 'animation: 1.3s sine-in-out infinite alternate lf-pulse-core;')
    rule(all, '', ' .lf-shine', 'animation: 1.9s linear infinite lf-shine;')
    rule(all, '.lf-only', '', 'display: inline-block;')
    rule(all, '.lf-dim', '', 'opacity: 1;')
    -- least rare first: a name in two lists gets the rarer (later) one
    for _, key in ipairs(LF.order) do
        local names = per[key]
        if key == 'rainbow' then
            local rb = 'animation: 1.3s sine-in-out infinite alternate lf-pulse, 3s linear infinite lf-rainbow-beam;'
            rule(names, '', '', 'font-effect: outline(1dp rgb(36, 24, 60)), glow(2dp rgb(255, 255, 255));')
            rule(names, '', ' .lf-text', 'animation: 3s linear infinite lf-rainbow-text;')
            rule(names, '', ' .lf-beam', rb)
            rule(names, '', ' .lf-base', rb)
        else
            local c = LF.colors[key]
            rule(names, '', ' .lf-beam', 'image-color: ' .. c .. ';')
            rule(names, '', ' .lf-base', 'image-color: ' .. c .. ';')
            rule(names, '', '', 'font-effect: outline(1dp ' .. c .. '), glow(3dp ' .. c .. ');')
        end
    end
end

function LF.css(lists)
    local out = { '/* generated by the Loot Filter (Options > Loot Filter > Save). Do not edit. */', '.lf-rules-ok { display: block; }' }
    css_block(out, lists, 'lfp-none')
    local plist, by = LF.load_profiles()
    for _, name in ipairs(plist) do css_block(out, by[name], LF.pclass(name)) end
    return table.concat(out, '\n') .. '\n'
end

function LF.write_css(lists)
    if not LF.io_ok then return false end
    local f = io.open(LF.css_file, 'w')
    if not f then return false end
    f:write(LF.css(lists))
    f:close()
    return true
end

-- saving the lists also rewrites the rules file
local save_txt = LF.save
function LF.save(lists)
    local ok, err = save_txt(lists)
    if ok then LF.css_ok = LF.write_css(lists) end
    return ok, err
end

LF.reload_event = 'lootfilter-reload'

local doc = document
local root = doc:GetElementById('dropped-item-labels-root')

-- the glow itself comes from styles/lf_rules.css (one rule set per profile + the plain lists).
-- The script switches the profile tag and the two checkbox modes on the label list.
-- Which rule sets did the game load at start? (read before the file is rewritten below)
local loaded = {}
pcall(function()
    local f = LF.io_ok and io.open(LF.css_file, 'r')
    if not f then return end
    for line in f:lines() do
        local tag, sig = line:match('^/%* set (%S+) (%S+) %*/')
        if tag then loaded[tag] = sig end
    end
    f:close()
end)
LF.loaded = loaded
local cur_tag = nil
local applied = 0
local function apply()
    local ok, err = pcall(function()
        local lists = LF.load()
        local any = false
        for _, k in ipairs(LF.order) do
            if #LF.split(lists[k]) ~= 0 then any = true end
        end
        -- active profile -> its tag if the game loaded it, else the plain lists
        local _, _, active = LF.load_profiles()
        local tag = 'lfp-none'
        if active and loaded[LF.pclass(active)] then tag = LF.pclass(active) end
        if root and tag ~= cur_tag then
            if cur_tag then root:SetClass(cur_tag, false) end
            root:SetClass(tag, true)
            cur_tag = tag
        end
        LF.live_tag = tag
        if root then
            root:SetClass('lf-only', (lists.only_filtered and any) and true or false)
            root:SetClass('lf-dim', (lists.dim_others and any) and true or false)
            root:SetClass('lf-sz0', lists.name_size == 0)
            root:SetClass('lf-sz1', lists.name_size == 1)
        end
        return lists
    end)
    applied = applied + 1
    doc:SetAttribute('lf-applied', tostring(applied))
    doc:SetAttribute('lf-error', ok and '' or tostring(err))
    doc:SetAttribute('lf-io', LF.io_ok and '1' or '0')
    return ok
end
LF.apply = apply
LootFilter = LF
doc:AddEventListener(LF.reload_event, function() apply() end)
apply()
-- keep the rules file in step with the saved lists for the next start
pcall(function() LF.write_css(LF.load()) end)
        </script>
    </head>
    <body class="ui-world-layer" id="dropped-item-labels">
        <!-- The model binds on a child: a body-level model attaches after parsing, too late for data-for templates. -->
        <!-- perf v3: the only bound label list. lf-name carries the drop name for the rules in lf_rules.css. -->
        <div id="dropped-item-labels-root" data-model="dropped-item-labels">
        <div class="dropped-item" data-for="label : labels" data-if="label.visible" data-attr-lf-name="label.name"
             data-style-color="label.color"
             data-style-left="label.x + 'px'" data-style-top="label.y + 'px'"><div class="lf-beam-wrap"><div class="lf-base"></div><div class="lf-beam"></div><div class="lf-core"></div><div class="lf-shine"></div></div><span class="lf-text">{{label.name}}</span><span class="pickup-status" data-if="show_pickup_status" data-class-available="label.can_pick_up">*</span></div>
        </div>
    </body>
</rml>
