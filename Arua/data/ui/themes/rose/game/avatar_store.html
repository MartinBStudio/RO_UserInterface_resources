<rml>
    <head>
        <title>Personal Store</title>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_sprites2.css" />
        <link type="text/rcss" href="../styles/ice_window.css" />
        <style>
            body { width: 320dp; }
            #game-avatar-store #window-content { height: auto; padding: 10dp; overflow: visible; }
            #store-company { color: #ccc; margin-bottom: 6dp; word-break: break-word; }
            .shop-tabs { display: flex; gap: 4dp; margin-bottom: 8dp; }
            .shop-tabs button { flex: 1; min-width: 0; box-sizing: border-box; }
            .shop-tabs button.active { color: yellow; decorator: tiled-horizontal(button-active-l, button-active-c, button-active-r); }
            /* 6 slots of 40dp + 1dp border each side (42dp) + 5 gaps of 3dp = 267dp in a 272dp grid: 5dp spare so pixel rounding at UI scales like 1.5-2.0 cannot push the 6th slot to a new row. (No border-box: the item picture follows the outer box, the empty-slot art the inner one -> offset.) */
            .shop-grid { display: flex; flex-wrap: wrap; width: 272dp; gap: 3dp; margin: 0 auto; padding-left: 2.5dp; }   /* half the 5dp spare on the left, so the row is centred */
            .shop-grid item-slot { width: 40dp; height: 40dp; flex: 0 0 40dp; border: 1dp transparent; }
            .shop-grid item-slot.selected { border-color: yellow; }
            .shop-selection { height: 42dp; margin-top: 8dp; }
            #selected-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: yellow; }
            .shop-price { display: flex; align-items: center; justify-content: flex-end; gap: 5dp; height: 21dp; }
            .shop-price img { width: 21dp; height: 21dp; flex-shrink: 0; }
            #store-state { color: #ccc; word-break: break-word; margin: 6dp 0; }
            .shop-help { font-size: 11dp; color: #ccc; margin: 6dp 0; }
            .shop-actions { display: flex; gap: 6dp; justify-content: center; }
            .shop-actions button { min-width: 84dp; }

            /* ===== ice theme (shared look from ice_window.css) ===== */
            #store-company { color: rgb(98, 124, 156); font-weight: 820; }
            body[id] .shop-tabs button.default { height: 28dp; line-height: 28dp; padding: 0dp 6dp; }
            body[id] .shop-tabs button.active,
            body[id] .shop-tabs button.active:hover {
                decorator: tiled-horizontal(ice-tab-sel-l, ice-tab-sel-c, ice-tab-sel-r);
                color: rgb(92, 50, 8);
            }
            .ice-box.store-box { margin: 0dp; padding: 6dp; }
            .shop-grid item-slot.selected { border-color: rgb(236, 176, 40); }
            .shop-selection {
                margin-top: 8dp;
                padding: 4dp 8dp;
                height: auto;
                background-color: rgb(236, 244, 251);
                border: 1dp rgb(176, 206, 232);
                border-radius: 8dp;
            }
            #selected-name { color: rgb(30, 62, 112); font-weight: 820; }
            .shop-price { color: rgb(170, 100, 20); font-weight: 820; }
            #store-state { color: rgb(36, 58, 98); }
            .shop-help { color: rgb(98, 124, 156); }

            /* fixed heights everywhere, so every shop opens at the same size
               (the game re-centres the window whenever its height changes) */
            #store-company { height: 18dp; line-height: 18dp; margin-bottom: 4dp; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            /* name left (wraps to 2 lines), price right, both centred vertically (as the dev layout) */
            .shop-selection { height: 46dp; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: row; align-items: center; gap: 8dp; }
            #selected-name { flex: 1; min-width: 0dp; white-space: normal; text-overflow: clip; word-break: break-word; line-height: 15dp; max-height: 30dp; overflow: hidden; }
            .shop-price { flex-shrink: 0; white-space: nowrap; }
            #store-state { height: 34dp; line-height: 17dp; overflow: hidden; }
        
            /* zulie: close-button style Z icon (atlas2) */
            body img[sprite="ice-zulie-n"] { width: 20dp; min-width: 20dp; height: 20dp; }
            body button.zulie { width: 20dp; min-width: 20dp; height: 20dp; decorator: image(ice-zulie-n); background-color: rgba(0, 0, 0, 0); border-width: 0dp; }
            body button.zulie:hover { decorator: image(ice-zulie-h); }
            body button.zulie:active { decorator: image(ice-zulie-a); }
            body button.zulie:disabled, body button.zulie[disabled] { decorator: image(ice-zulie-n); }
            /* long shop names: start a bit further left, one line, end in ... before the X */
            #game-avatar-store .window-title {
                box-sizing: border-box;
                padding-left: 50dp;
                padding-right: 40dp;
                font-size: 15dp;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        </style>
        <link type="text/rcss" href="../styles/ice_sprites_dark.css" />
        <link type="text/rcss" href="../styles/dark/avatar_store.css" />
    </head>
    <body id="game-avatar-store" template="window-fixed-size">

            <item-slot id="buy_slot27" data-slot="26" onclick="select" data-class-selected="slots[56].selected" data-attr-dimmed="slots[56].dimmed" />
            <item-slot id="buy_slot28" data-slot="27" onclick="select" data-class-selected="slots[57].selected" data-attr-dimmed="slots[57].dimmed" />

        </div>
        </div>
        <div class="shop-selection">
            <div id="selected-name">{{ selected_name }}</div>
            <div class="shop-price"><img id="selected-currency" sprite="ice-zulie-n" data-style-visibility="has_selection ? 'visible' : 'hidden'" /><span id="selected-price">{{ selected_price }}</span></div>
        </div>
        <div id="store-state">{{ state_label }}</div>
        <div class="shop-help">Double-click an item to trade, or drag it to or from your inventory.</div>
        <div class="shop-actions">
            <button id="trade" class="default ice-primary" onclick="trade" data-attrif-disabled="!trade_enabled">{{ trade_label }}</button>
            <button id="stop" class="default" onclick="stop" data-if="owner">Stop</button>
        </div>
        </div>
        <div class="ice-fx ice-tl small"></div>
        <div class="ice-fx ice-br small"></div>
    </body>
</rml>
