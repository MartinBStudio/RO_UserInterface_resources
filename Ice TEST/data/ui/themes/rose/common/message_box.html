<rml>
    <head>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />

        <style>
            body
            {
                width: 340dp;
            }

            #window-content
            {
                padding: 10dp;
                min-height: 100dp;

                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            #content {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 100%;
            }

            #content > div {
                width: 100%;
                display: flex;
                justify-content: center;
                margin-bottom: 10px;
            }

            #icon-container {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 5dp;
            }

            #content > #message-container {
                display: block;
                max-height: 50vh;
                overflow-y: auto;
                text-align: center;
            }

            #message
            {
                display: block;
                word-break: break-word;
                font-weight: bold;
            }

            #message.plain
            {
                white-space: pre-wrap;
            }

            progress {
                height: 6dp;
                width: 125dp;
            }

            /* ===== ice theme (same composition as Game Arena) ===== */
            body#common-message-box.window-fixed-size {
                decorator: tiled-box(
                    ice-frame-tl, ice-frame-t, ice-frame-tr,
                    ice-frame-l,  ice-frame-c, ice-frame-r,
                    ice-frame-bl, ice-frame-b, ice-frame-br
                );
                padding: 6dp;
                padding-top: 40dp;
            }
            body#common-message-box .window-title {
                position: absolute;
                top: 0dp;
                left: 0dp;
                width: 100%;
                height: 40dp;
                padding-left: 60dp;
                color: white;
                font-size: 18dp;
                font-weight: 820;
                font-effect: outline(1.5dp rgb(28, 78, 138));
                text-align: left;
                line-height: 40dp;
            }
            body#common-message-box #window-content {
                decorator: tiled-box(
                    ice-panel-tl, ice-panel-t, ice-panel-tr,
                    ice-panel-l,  ice-panel-c, ice-panel-r,
                    ice-panel-bl, ice-panel-b, ice-panel-br
                );
                color: rgb(36, 58, 98);
                font-effect: none;
                overflow: visible;
            }
            /* the message sits in the light ice-blue box */
            body#common-message-box #content > #message-container {
                box-sizing: border-box;
                padding: 10dp 12dp;
                background-color: rgb(236, 244, 251);
                border: 1dp rgb(176, 206, 232);
                border-radius: 8dp;
            }
            body#common-message-box #message {
                color: rgb(30, 62, 112);
                font-effect: none;
            }

            /* buttons */
            body#common-message-box button.default {
                decorator: tiled-horizontal(ice-tab-l, ice-tab-c, ice-tab-r);
                height: 30dp;
                line-height: 30dp;
                padding: 0dp 12dp;
                margin-top: 4dp;
                color: rgb(30, 62, 112);
                font-weight: 820;
                font-effect: none;
            }
            body#common-message-box button.default:hover {
                decorator: tiled-horizontal(ice-tab-hover-l, ice-tab-hover-c, ice-tab-hover-r);
            }
            body#common-message-box button#confirm {
                decorator: tiled-horizontal(ice-tab-sel-l, ice-tab-sel-c, ice-tab-sel-r);
                color: rgb(92, 50, 8);
            }
            body#common-message-box button#confirm:hover {
                decorator: tiled-horizontal(ice-tab-hover-l, ice-tab-hover-c, ice-tab-hover-r);
            }
            body#common-message-box button.default:disabled,
            body#common-message-box button.default[disabled] {
                decorator: tiled-horizontal(ice-tab-l, ice-tab-c, ice-tab-r);
                opacity: 0.45;
            }
            body#common-message-box button#cancel { color: rgb(170, 40, 40); }

            /* inputs that some prompts inject */
            body#common-message-box #input-container input {
                decorator: none;
                background-color: rgb(255, 255, 255);
                border: 1dp rgb(150, 190, 225);
                border-radius: 5dp;
                color: rgb(30, 62, 112);
                font-effect: none;
            }

            /* countdown */
            #time-remaining-text { color: rgb(36, 58, 98); font-weight: 820; }
            .horizontal {
                background-color: rgb(214, 228, 242);
                border-radius: 3dp;
            }
            .horizontal fill {
                background-color: rgb(90, 160, 220);
                border-radius: 3dp;
            }

            .ice-fx { position: absolute; pointer-events: none; z-index: 10; }
            #mb-corner-tl { left: -1dp; top: -23dp; width: 81dp; height: 70dp; decorator: image(ice-corner-tl); }
            #mb-corner-br { right: -2dp; bottom: -16dp; width: 77dp; height: 67dp; decorator: image(ice-corner-br); }
        </style>
        <link type="text/rcss" href="../styles/ice_sprites_dark.css" />
        <link type="text/rcss" href="../styles/dark/com_message_box.css" />
    </head>

    <!-- Each message box instance attaches this document to its own data model. -->
    <body id="common-message-box" class="window-fixed-size" onkeyup="keyup">
        <handle class="window-title" move_target="#document" id="window-title-text">&nbsp;</handle>

        <div id="window-content">
            <div id="content">
                <div id="icon-container">
                    <icon data-if="icon_class != ''" data-attr-class="icon_class" />
                </div>
                <div id="message-container"><label id="message" data-rml="message" data-class-plain="plain_text"></label></div>
                <div id="input-container"></div>
            </div>
            <button class="default" id="confirm" onclick="confirm" data-if="confirm_visible" data-attrif-disabled="!input_valid"><str data-attr-legacy-text="confirm_label" /></button>
            <button class="default" id="cancel" onclick="cancel" data-if="cancel_visible"><str data-attr-legacy-text="cancel_label" /></button>
            <div id="timer-container" data-if="timer_visible">
                <span style="display: flex; flex-direction: row; align-items: center;">
                    <img id="time-remaining-icon" data-attr-sprite="timer_warning ? 'timer-clock-warning' : 'timer-clock'" />
                    <span>
                        <div id="time-remaining-text">{{ seconds_remaining }} seconds remaining.</div>
                        <progress id="time-remaining-progress" class="horizontal" data-attr-value="timer_value" data-attr-max="timer_max" />
                    </span>
                </span>
            </div>
        </div>

        <div class="ice-fx" id="mb-corner-tl"></div>
        <div class="ice-fx" id="mb-corner-br"></div>
    </body>
</rml>
