<rml>
    <head>
        <title>Help</title>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/components.css" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_sprites2.css" />
        <link type="text/rcss" href="../styles/ice_window.css" />
        <style>
            body { width: 392dp; max-width: 95vw; }
            #tutorial-viewport { height: 80dp; overflow: hidden; }
            #tutorial-text { display: block; position: relative; line-height: 20dp; white-space: pre-wrap; }
            #next.blink { animation: 0.5s cubic-in-out infinite alternate next-page; }
            @keyframes next-page {
                from { image-color: rgba(190, 190, 190, 255); }
                to { image-color: white; }
            }

            /* ===== ice theme ===== */
            #tutorial #window-content { padding: 8dp; }
            #tutorial .content-box.ui-section {
                background-color: rgb(255, 255, 255);
                border: 1dp rgb(176, 206, 232);
                border-radius: 8dp;
                padding: 8dp 10dp;
            }
            #tutorial #tutorial-text { color: rgb(36, 58, 98); font-effect: none; }
            #tutorial .ui-pages { display: flex; flex-direction: row; align-items: center; justify-content: center; border-top-width: 0dp; margin-top: 6dp; }
            #tutorial #page { min-width: 60dp; text-align: center; color: rgb(30, 62, 112); font-weight: 820; font-effect: none; }
            #tutorial button.left-sm,
            #tutorial button.right-sm { margin: 0dp; width: 22dp; min-width: 22dp; height: 22dp; }
            #tutorial button.left-sm { decorator: image(ice-left-n); }
            #tutorial button.left-sm:hover { decorator: image(ice-left-h); }
            #tutorial button.left-sm:active { decorator: image(ice-left-a); }
            #tutorial button.right-sm { decorator: image(ice-right-n); }
            #tutorial button.right-sm:hover { decorator: image(ice-right-h); }
            #tutorial button.right-sm:active { decorator: image(ice-right-a); }
            #tutorial button.left-sm[disabled], #tutorial button.right-sm[disabled] { opacity: 0.4; }
            /* next page waiting: soft gold pulse */
            @keyframes ice-next-page {
                from { image-color: rgb(255, 255, 255); }
                to { image-color: rgb(255, 214, 120); }
            }
            #tutorial #next.blink { animation: 0.6s sine-in-out infinite alternate ice-next-page; }
        </style>
    </head>
    <body template="window-fixed-size" id="tutorial">
        <div data-model="tutorial">
        <div class="content-box ui-section">
            <div id="tutorial-viewport" data-style-height="page_height + 'px'"><str id="tutorial-text" data-attr-notify-message="string_id" data-style-line-height="line_height + 'px'" data-style-top="offset + 'px'"></str></div>
        </div>
        <div class="ui-pages ui-footer">
            <button class="left-sm" id="previous" onclick="previous" title="Previous page" data-attrif-disabled="!has_previous"></button>
            <span id="page" class="ui-page">{{ page_label }}</span>
            <button class="right-sm" id="next" onclick="next" title="Next page" data-attrif-disabled="!has_next" data-class-blink="has_next"></button>
        </div>
        </div>
        <div class="ice-fx ice-tl small"></div>
        <div class="ice-fx ice-br small"></div>
    </body>
</rml>
