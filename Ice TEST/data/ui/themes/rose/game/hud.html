<rml>

    <head>
        <title></title>
        <link type="text/template" href="../templates/window-box.html" />
        <link type="text/template" href="../templates/elements/gauge.html" />
        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_skillicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_elementicon.css" />
        <link type="text/rcss" href="../styles/scrollbar.css" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_gauges.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />
        <link type="text/rcss" href="../styles/spritesheet_inventory.css" />

        <style>
            body {
                margin: 5dp;
            }


            .window-title {
                font-size: 12dp;
            }

            #window-title-text {
                padding-top: 2dp;
                font-effect: outline(1dp black), glow(2dp rgb(0, 255, 0));
            }

            .window-fixed-size {
                padding-top: 20dp;
            }

            #state-icon-container { margin-top: 5dp; width: 195dp; }
            .hud-status-row { display: flex; flex-wrap: wrap; }
            .hud-status-icon { display: inline-block; width: 20dp; height: 20dp; margin: 0 1dp 1dp 0; flex-shrink: 0; }
            .hud-status-icon img { width: 20dp; height: 20dp; pointer-events: none; }
            .hud-status-icon.blink { opacity: 0.25; }
            .hud-status-icon.inactive img { image-color: rgb(255, 0, 0); }
            .hud-status-icon.warning img { image-color: rgb(255, 180, 180); }

            #window-content.content {
                padding: 1dp 2dp 1dp 1dp;
                display: flex;
                flex-direction: column;
            }

            span.marker {
                position: absolute;
            }

            div.footer {
                flex: 2;
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                margin: 2dp 2dp 0 2dp;
                font-size: 12dp;
            }

            div.footer>span.left {
                flex-grow: 1;
                text-align: left;
                font-weight: 800;
            }

            div.footer>span.right {
                flex-grow: 1;
                text-align: right;
            }

            b.weight,
            span.level {
                color: yellow;
            }

            @keyframes low {
                from {
                    color: red;
                }

                to {
                    color: white;
                }
            }

            gauge.low-value-animation {
                animation: 1.5s cubic-in-out infinite alternate low;
            }

            div.container {
                flex: 2;
                display: flex;
            }

            div.hud {
                width: 195dp;
            }

            div.pat-fuel {
                display: flex;
                height: 100%;
                flex-direction: column;
                justify-content: flex-end;
                margin-left: 5dp;
            }

            .fuel-container {
                height: 100%;
            }

            .tooltip .tooltiptext {
                background: rgba(0, 0, 0, 200);
                min-width: 50dp;
                width: 80dp;
                left: 100%;
                bottom: 50dp;
            }

            /* --- spike test: skill-hud (buff tray) data-model cloned in here so it rides on hud's persisted window position --- */
            #skill-hud-root { position: absolute; top: 0dp; left: 100%; margin-left: 8dp; width: auto; max-width: 70vw; max-height: 40vh; pointer-events: none; font-effect: outline(1dp black), shadow(1dp 1dp black); }
            #skill-hud-list { display: flex; flex-direction: row; flex-wrap: wrap; overflow-y: auto; max-height: 40vh; pointer-events: none; }
            #skill-hud-list scrollbarvertical { pointer-events: auto; }
            .hud-skill { position: relative; width: 40dp; min-width: 40dp; height: 60dp; flex-shrink: 0; pointer-events: auto; }
            .hud-skill-icon { display: block; width: 40dp; height: 40dp; pointer-events: none; }
            .hud-skill.dimmed .hud-skill-icon { image-color: rgb(128, 128, 128); }
            .hud-skill.invalid-clan:not(.dimmed) .hud-skill-icon { image-color: rgb(128, 128, 255); }
            .hud-skill-level { position: absolute; top: 22dp; right: 4dp; font-size: 12dp; font-weight: 820; pointer-events: none; }
            .hud-skill-timer { display: block; width: 40dp; height: 20dp; line-height: 20dp; text-align: center; font-size: 12dp; font-weight: 820; pointer-events: none; }
            .hud-skill-element { position: absolute; top: 0dp; left: 20dp; width: 18dp; height: 18dp; pointer-events: none; }
            .hud-skill.dimmed .hud-skill-element { image-color: rgb(128, 128, 128); }
            #skill-hud-tooltip { position: absolute; z-index: 100; clip: none; pointer-events: none; width: 260dp; max-width: 90vw; max-height: 90vh; }
            .skill-tooltip-name { display: block; color: yellow; margin-bottom: 8dp; }
            .skill-tooltip-name.invalid-clan { color: rgb(128, 128, 128); }
            .skill-tooltip-description { display: block; margin-bottom: 8dp; }
            .skill-tooltip-time { display: block; color: rgb(90, 230, 110); }
            .skill-tooltip-time.warning { color: rgb(255, 170, 60); }
            .skill-tooltip-time.danger { color: rgb(255, 80, 80); }

            /* --- ice theme: mini frame, cream panel behind the bars --- */
            #hud div.hud { width: 205dp; }
            #hud .window-fixed-size {
                decorator: tiled-box(
                    ice-mini-tl, ice-mini-t, ice-mini-tr,
                    ice-mini-l,  ice-mini-c, ice-mini-r,
                    ice-mini-bl, ice-mini-b, ice-mini-br
                );
                padding: 24dp 5dp 3dp 5dp;
            }
            #hud .window-title {
                color: white;
                font-size: 13dp;
                font-weight: 820;
                line-height: 22dp;
                padding-left: 9dp;
            }
            #hud #window-title-text {
                padding-top: 1dp;
                font-effect: outline(1dp rgb(28, 78, 138));
            }
            #hud #window-content.content {
                decorator: tiled-box(
                    ice-panel-tl, ice-panel-t, ice-panel-tr,
                    ice-panel-l,  ice-panel-c, ice-panel-r,
                    ice-panel-bl, ice-panel-b, ice-panel-br
                );
                padding: 4dp 5dp 4dp 5dp;
            }
            /* v2: flourishes, footer inside the panel, level badge, spaced bars */
            #hud .window-fixed-size { position: relative; padding-top: 25dp; }
            /* the box is position:relative (for the flourishes), so lift the drag handle + name above it */
            #hud .window-title { padding-left: 40dp; font-size: 14dp; line-height: 24dp; z-index: 20; }
            #hud gauge#health, #hud gauge#mana { margin-bottom: 3dp; }
            #hud gauge#exp { height: 12dp; margin-top: 0dp; }
            #hud gauge#exp > span { font-size: 10dp; line-height: 12dp; margin-top: 0dp; }
            #hud #window-content.content { padding: 6dp 5dp 7dp 5dp; }
            #hud .window-fixed-size { padding-bottom: 5dp; }
            #hud div.footer {
                color: rgb(36, 58, 98);
                font-effect: none;
                font-weight: 820;
                margin: 6dp 1dp 0dp 1dp;
                padding-right: 36dp;
            }
            #hud span.level {
                color: rgb(170, 100, 20);
                font-weight: 820;
            }
            #hud b.weight { color: rgb(170, 100, 20); }
            .ice-fx { position: absolute; pointer-events: none; z-index: 10; }
            #ice-corner-tl { left: -2dp; top: -14dp; width: 52dp; height: 45dp; decorator: image(ice-corner-tl); }
            #ice-corner-br { right: -1dp; bottom: -10dp; width: 50dp; height: 43dp; decorator: image(ice-corner-br); }

            /* v3: wider box with the equipped weapon / ammo (idea + data binding from Zurn's hud) */
            /* v4: tile spans HP top -> EXP bottom (26 + 3 + 26 + 3 + 12 = 70dp); level + class in the title */
            #hud div.hud { width: 281dp; }
            #state-icon-container { width: 281dp; }
            /* status groups (e.g. No EXP, Storage) side by side instead of one row each */
            #state-icon-container { display: flex; flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
            #state-icon-container .hud-status-row { margin-right: 1dp; }
            div.weapon-slot {
                position: absolute;
                left: 201dp;
                top: 31dp;
                width: 70dp;
                height: 70dp;
                decorator: image(ice-equip);
                z-index: 15;
            }
            div.weapon-slot > img {
                position: absolute;
                left: 4dp;
                top: 4dp;
                width: 62dp;
                height: 62dp;
                opacity: 0.55;
                pointer-events: none;
            }
            div.weapon-slot item-slot {
                position: absolute;
                left: 4dp;
                top: 4dp;
                width: 62dp;
                height: 62dp;
            }
            #hud .title-sub {
                margin-left: 6dp;
                font-size: 11dp;
                color: rgb(255, 241, 196);
                font-effect: outline(1dp rgb(28, 78, 138));
            }
            #hud .title-sub span.level { color: rgb(255, 214, 80); margin-right: 4dp; }
            /* footer: level + class | weight icon % | zulie coin amount */
            #hud div.footer > span.right { flex-grow: 2; }
            #hud .ft-ico { width: 14dp; height: 14dp; margin: 0dp 2dp 0dp 7dp; }
            #hud b.money { color: rgb(170, 100, 20); }
        </style>
    </head>

    <body id="hud" onclick="self-target">
        <handle data-model="character" class="window-title" style="cursor: move" move_target="#document" id="window-title-text">{{name}}<span class="title-sub"><span class="level">{{level}}</span> <str data-attr-job-name="job">Visitor</str></span></handle>
        <div class="container">
            <div class="hud" data-model="character">
                <div class="window-fixed-size">
                    <div id="window-content" class="content">
                        <!-- HP Gauge -->
                        <gauge id="health" class="horizontal-lg-lg red"
                            data-class-low-value-animation="health_percent <= 20" data-attr-gvalue="health"
                            data-attr-gmax="max_health">
                            <template src="gauge-info-vmp" />
                        </gauge>

                        <!-- MP Gauge -->
                        <gauge id="mana" class="horizontal-lg-lg blue"
                            data-class-low-value-animation="mana_percent <= 20" data-attr-gvalue="mana"
                            data-attr-gmax="max_mana">
                            <template src="gauge-info-vmp" />
                        </gauge>

                        <!-- Exp Gauge -->
                        <gauge id="exp" class="horizontal-sm-lg yellow" data-attr-gvalue="experience"
                            data-attr-gmax="max_experience">
                            <span class="marker"><img sprite="gauge-bg-sm-lg-markers" /></span>
                            <span><label id="percent" />%</span>
                        </gauge>

                    </div>
                    <div class="ice-fx" id="ice-corner-tl"></div>
                    <div class="ice-fx" id="ice-corner-br"></div>
                </div>
            </div>
            <!-- Weapon / ammo slot (binding from Zurn's hud: shows ammo when equipped, else the weapon) -->
            <div class="weapon-slot" data-model="inventory">
                <img sprite="GEN_INVSLOT08"
                    data-if="equipped_weapon.id == 0 &amp;&amp; equipped_shot_item.id == 0" />

                <item-slot data-if="equipped_shot_item.id == 0"
                    data-attr-item-key="equipped_weapon.key"
                    data-attr-item-id="equipped_weapon.id"
                    data-attr-item-type="equipped_weapon.type"
                    data-attr-item-quantity="equipped_weapon.quantity"
                    data-attr-item-refine-grade="equipped_weapon.refine_grade"
                    data-attr-item-life="equipped_weapon.life"
                    data-attr-item-durability="equipped_weapon.durability"
                    data-attr-item-appraisal="equipped_weapon.appraisal_no"
                    data-attr-item-refine-color="equipped_weapon.refine_color" />

                <item-slot data-if="equipped_shot_item.id != 0"
                    data-attr-item-key="equipped_shot_item.key"
                    data-attr-item-id="equipped_shot_item.id"
                    data-attr-item-type="equipped_shot_item.type"
                    data-attr-item-quantity="equipped_shot_item.quantity" />
            </div>

            <!-- PAT Fuel --->
            <div onclick="ignore" data-model="pat">
                <div class="pat-fuel">
                    <gauge data-if="show" id="fuel" class="horizontal-sm-md green" data-attr-gvalue="fuel"
                        data-attr-gmax="max_fuel">
                        <span><label id="percent" />%</span>
                    </gauge>
                </div>
            </div>
        </div>

        <!-- State Icons -->
        <div id="state-icon-container" onclick="ignore" data-model="hud-statuses">
            <div class="hud-status-row" data-for="group : groups" data-if="group.statuses.size > 0">
                <span class="hud-status-icon" data-for="status : group.statuses" data-class-blink="status.blink" data-class-inactive="!status.active" data-class-warning="status.is_warning" data-attr-hud-status="status.index"><img data-attr-sprite="status.sprite"/></span>
            </div>
        </div>

        <!-- spike test: buff/debuff tray cloned from skill_hud.html, same data-model name -->
        <div id="skill-hud-root" data-model="skill-hud" data-style-width="strip_width + 'dp'" data-style-max-width="strip_max_width + 'dp'">
            <div id="skill-hud-list">
                <div class="hud-skill" data-for="skill : entries" data-attr-id="'hud-skill-' + skill.slot" data-class-dimmed="skill.dimmed" data-class-invalid-clan="skill.invalid_clan" data-attr-onmouseover="'skill-tooltip:' + skill.slot + ':' + skill.skill_id" onmouseout="hide-tooltip">
                    <img class="hud-skill-icon" data-attr-sprite="'skillicon-' + skill.icon" />
                    <img class="hud-skill-element" data-if="skill.element > 0" data-attr-sprite="'elementicon-' + skill.element" />
                    <span class="hud-skill-level" data-if="skill.level > 1">{{skill.level}}</span>
                    <span class="hud-skill-timer">{{skill.timer}}</span>
                </div>
            </div>
            <div id="skill-hud-tooltip" data-if="tooltip_visible" data-style-left="tooltip_x + 'px'" data-style-top="tooltip_y + 'px'">
                <div class="skill-tooltip-name" data-class-invalid-clan="tooltip_invalid_clan">{{tooltip_name}}</div>
                <div class="skill-tooltip-description" data-if="tooltip_description != ''">{{tooltip_description}}</div>
                <div class="skill-tooltip-time" data-if="tooltip_remaining != ''" data-class-warning="tooltip_time_class == 'warning'" data-class-danger="tooltip_time_class == 'danger'">{{tooltip_remaining}}</div>
            </div>
        </div>
    </body>
</rml>
