    <head>
        <title>Inventory</title>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/spritesheet_elementicon.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />
        <link type="text/rcss" href="../styles/spritesheet_inventory.css" />
        <link type="text/rcss" href="../styles/components.css" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_sprites2.css" />
        <style>
            body { width: 322dp; max-width: 95vw; }
            .equipment-pane { position: relative; width: 269dp; height: 133dp; margin: 0 auto 12dp; }
            .equipment-cell { position: absolute; width: 43dp; height: 43dp; }
            .equipment-cell > img { position: absolute; width: 43dp; height: 43dp; pointer-events: none; }
            .equipment-cell item-slot { position: absolute; top: 1dp; left: 1dp; width: 41dp; height: 41dp; }
            .equipment-cell.filled > img { visibility: hidden; }
            .bag-grid { width: 260dp; }
            .inventory-footer { display: flex; align-items: center; justify-content: space-between; gap: 8dp; }
            #inventory-weight { color: rgb(0, 210, 255); font-effect: outline(1dp black), glow(1.5dp rgb(0, 210, 255)); }
            #inventory-weight.overweight { color: rgb(255, 100, 100); }
            .vehicle-stats { position: absolute; top: 49dp; left: 0; right: 0; font-size: 12dp; }
            .vehicle-stat { display: inline-flex; justify-content: space-between; width: 48%; margin-right: 2%; line-height: 19dp; }
            .vehicle-stat span { color: rgb(255, 247, 191); }
            #inventory-operation { color: rgb(255, 247, 191); font-size: 12dp; margin-bottom: 8dp; }

            /* --- added: collapse toggle --- */
            /* in the title band, left of the X and the same size: orange minus = collapse, green plus = expand
               (positioned against #window-content, which starts 40dp below the top and 6dp in from the right) */
            body#inventory-window input#inv-collapse {
                position: absolute; top: -33dp; right: 30dp;
                width: 24dp; height: 24dp; margin: 0dp;
                background-color: rgba(0, 0, 0, 0); border: 0dp rgba(0, 0, 0, 0); border-radius: 0dp;
                decorator: image(ice-min-n); cursor: pointer; z-index: 20;
            }
            body#inventory-window input#inv-collapse:hover { decorator: image(ice-min-h); }
            body#inventory-window input#inv-collapse:active { decorator: image(ice-min-a); }
            body#inventory-window input#inv-collapse:checked { decorator: image(ice-learn-n); }
            body#inventory-window input#inv-collapse:checked:hover { decorator: image(ice-learn-h); }
            body#inventory-window input#inv-collapse:checked:active { decorator: image(ice-learn-a); }

            #inv-collapse:checked ~ div .ui-tabs,
            #inv-collapse:checked ~ div .equipment-pane,
            #inv-collapse:checked ~ div #inventory-operation,
            #inv-collapse:checked ~ div .inventory-footer,
            #inv-collapse:checked ~ div .eq-box {
                display: none;
            }
            #inv-collapse:checked ~ div .bag-grid .bag-cell:nth-last-child(n+7) {
                display: none;
            }

            /* --- ice theme v3: custom art (imgs/iceinv.dds), Inventory only --- */

            /* Outer frame: shaded 9-slice with gold trim and glossy title band */
            .window-fixed-size {
                decorator: tiled-box(
                    ice-frame-tl, ice-frame-t, ice-frame-tr,
                    ice-frame-l,  ice-frame-c, ice-frame-r,
                    ice-frame-bl, ice-frame-b, ice-frame-br
                );
                background-color: rgba(0, 0, 0, 0);
                border: 0dp rgba(0, 0, 0, 0);
                border-radius: 0dp;
                padding: 6dp;
                padding-top: 40dp;
            }
            .window-title {
                position: absolute;
                top: 0dp;
                left: 0dp;
                width: 100%;
                height: 40dp;
                padding-left: 60dp;
                background-color: rgba(0, 0, 0, 0);
                color: white;
                font-size: 20dp;
                font-weight: 820;
                font-effect: outline(1.5dp rgb(28, 78, 138));
                text-align: left;
                line-height: 40dp;
            }
            .window-title-text { margin-left: 0dp; }
            button.window-title-close {
                top: 7dp;
                right: 8dp;
            }

            /* Inner panel: cream 9-slice with soft inset shadow */
            body#inventory-window #window-content {
                decorator: tiled-box(
                    ice-panel-tl, ice-panel-t, ice-panel-tr,
                    ice-panel-l,  ice-panel-c, ice-panel-r,
                    ice-panel-bl, ice-panel-b, ice-panel-br
                );
                background-color: rgba(0, 0, 0, 0);
                border: 0dp rgba(0, 0, 0, 0);
                border-radius: 0dp;
                overflow: visible;
                z-index: 0;
                color: rgb(36, 58, 98);
            }

            /* Flourishes (pure decoration, never catch the mouse) */
            .ice-fx { position: absolute; pointer-events: none; z-index: 10; }

            #ice-corner-tl { left: -8dp; top: -63dp; width: 81dp; height: 70dp; decorator: image(ice-corner-tl); }
            #ice-corner-br { right: -8dp; bottom: -21dp; width: 77dp; height: 67dp; decorator: image(ice-corner-br); }
            /* close button sits on top of the top-right bracket */
            body#inventory-window button.window-title-close { z-index: 20; }
            /* footer: weight and zulie stacked on the left, slightly smaller */
            body#inventory-window .inventory-footer { flex-direction: row; align-items: center; justify-content: space-between; gap: 8dp; }
            body#inventory-window .inventory-footer .ui-currency { justify-content: flex-start; min-height: 18dp; font-size: 13dp; }
            body#inventory-window .inventory-footer .ui-currency > img,
            body#inventory-window .inventory-footer .ui-currency > button.zulie { width: 18dp; min-width: 18dp; height: 18dp; }

            /* zulie button: close-button style Z icon */
            body#inventory-window #inventory-money { decorator: image(ice-zulie-n); background-color: rgba(0, 0, 0, 0); border-width: 0dp; }
            body#inventory-window #inventory-money:hover { decorator: image(ice-zulie-h); }
            body#inventory-window #inventory-money:active { decorator: image(ice-zulie-a); }
            body#inventory-window #inventory-money:disabled,
            body#inventory-window #inventory-money[disabled] { decorator: image(ice-zulie-n); opacity: 0.6; }
            body#inventory-window .inventory-footer .ui-currency > img,
            body#inventory-window .inventory-footer .ui-currency > button.zulie { margin-right: 5dp; }

            /* Tabs: glossy 3-slice pills, selected = warm gold */
            body#inventory-window .ui-tabs { gap: 6dp; margin-bottom: 10dp; }
            body#inventory-window .ui-tabs > button.default {
                decorator: tiled-horizontal(ice-tab-l, ice-tab-c, ice-tab-r);
                background-color: rgba(0, 0, 0, 0);
                border: 0dp rgba(0, 0, 0, 0);
                border-radius: 0dp;
                overflow: visible;
                text-align: center;
                padding: 0 6dp;
                height: 28dp;
                line-height: 28dp;
                font-size: 14dp;
                font-weight: 820;
            }
            body#inventory-window .ui-tabs > button.default:hover {
                decorator: tiled-horizontal(ice-tab-hover-l, ice-tab-hover-c, ice-tab-hover-r);
            }
            body#inventory-window .ui-tabs > button.default,
            body#inventory-window .ui-tabs > button.default str {
                color: rgb(30, 62, 112);
                font-effect: none;
            }
            body#inventory-window .ui-tabs > button.active,
            body#inventory-window .ui-tabs > button.selected,
            body#inventory-window .ui-tabs > button.active:hover,
            body#inventory-window .ui-tabs > button.selected:hover {
                decorator: tiled-horizontal(ice-tab-sel-l, ice-tab-sel-c, ice-tab-sel-r);
            }
            body#inventory-window .ui-tabs > button.active,
            body#inventory-window .ui-tabs > button.active str,
            body#inventory-window .ui-tabs > button.selected,
            body#inventory-window .ui-tabs > button.selected str {
                color: rgb(92, 50, 8);
                font-effect: none;
            }

            /* Slots: shaded tiles; gold tile when equipped */
            .equipment-cell { decorator: image(ice-equip); }
            .equipment-cell.filled { decorator: image(ice-equip-gold); }
            .equipment-cell > img { opacity: 0.55; }
            .bag-cell { decorator: image(ice-slot); }
            .bag-grid { margin-top: 2dp; }
            item-slot[empty="1"] { decorator: none; }

            /* Footer: dark readable text, no neon glow */
            /* Arena composition: equipment, bag grid and footer each in a light ice-blue box */
            .inv-box {
                padding: 8dp;
                background-color: rgb(236, 244, 251);
                border: 1dp rgb(176, 206, 232);
                border-radius: 8dp;
            }
            .eq-box { margin-bottom: 10dp; }
            .eq-box .equipment-pane { margin: 0 auto; }
            .bag-box { padding: 8dp 7dp; }
            body#inventory-window .inventory-footer {
                margin-top: 10dp;
                padding: 6dp 40dp 6dp 10dp;
                border-top: 1dp rgb(176, 206, 232);
                background-color: rgb(236, 244, 251);
                border: 1dp rgb(176, 206, 232);
                border-radius: 8dp;
            }
            .ui-currency, #inventory-weight, #inventory-zulie {
                color: rgb(36, 58, 98);
                font-size: 15dp;
                font-weight: 820;
                font-effect: none;
            }
            #inventory-weight.overweight { color: rgb(200, 50, 50); }

            /* Text that was light-on-dark before */
            #inventory-operation { color: rgb(150, 92, 20); }
            .vehicle-stats { color: rgb(36, 58, 98); }
            .vehicle-stat span { color: rgb(170, 100, 20); }
        </style>
