<rml>
    <head>
        <title>Mail</title>

        <link type="text/template" href="../templates/window-resizeable.html" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_window.css" />

        <style>
            #game-mail
            {
                width: 500dp;
                height: 300dp;
                min-width: 410dp;
                min-height: 200dp;
            }

            .from {
                color: #aaa;
            }

            .timestamp {
                color: #aaa;
            }

            .unread > .from {
                color: yellow;
            }

            .full {
                color: red;
            }

            tabset {
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
            }

            tab.default {
                min-width: 100dp;
            }

            tabset > panels {
                flex: 1;
            }

            .content-box {
                margin: 4dp;
            }

            /* ===== ice theme ===== */
            #game-mail #window-content { padding: 6dp; }
            #game-mail tab.default { margin-right: 4dp; }
            #game-mail .content-box { margin: 4dp; }

            /* inbox list */
            #game-mail .mail-head { color: rgb(30, 62, 112); font-weight: 820; }
            /* old-theme label boxes -> plain text */
            #game-mail label.text {
                background-color: rgba(0, 0, 0, 0);
                decorator: none;
                border: 0dp;
                padding: 0dp;
                font-effect: none;
            }
            #game-mail .mail-count { color: rgb(98, 124, 156); font-weight: 820; }
            #game-mail .full { color: rgb(190, 50, 40); font-weight: 820; }
            #game-mail #inbox listbox-item {
                display: block;
                padding: 4dp 6dp;
                margin-bottom: 3dp;
                background-color: rgb(255, 255, 255);
                border: 1dp rgb(196, 218, 238);
                border-radius: 5dp;
                decorator: none;
            }
            #game-mail #inbox listbox-item:hover { background-color: rgb(240, 247, 253); border-color: rgb(120, 175, 225); }
            #game-mail #inbox listbox-item[selected],
            #game-mail #inbox listbox-item[selected]:hover { background-color: rgb(255, 248, 228); border-color: rgb(214, 166, 60); }
            #game-mail .from { color: rgb(30, 62, 112); font-effect: none; }
            #game-mail .timestamp { color: rgb(120, 140, 170); font-size: 11dp; font-effect: none; }
            #game-mail .unread > .from { color: rgb(170, 100, 20); font-weight: 820; }

            /* reading pane: header rows + white message box */
            #game-mail .mail-read td { color: rgb(30, 62, 112); font-effect: none; }
            #game-mail .mail-read td:first-child { font-weight: 820; }
            #game-mail .mail-read label.text { color: rgb(36, 58, 98); }
            #game-mail #view-mail-message {
                padding: 6dp 8dp;
                background-color: rgb(255, 255, 255);
                border: 1dp rgb(196, 218, 238);
                border-radius: 6dp;
                color: rgb(36, 58, 98);
                font-effect: none;
            }
            #game-mail .mail-delete { color: rgb(170, 40, 40); }

            /* send tab */
            #game-mail .mail-send span.mail-to { color: rgb(30, 62, 112); font-weight: 820; }
            #game-mail .mail-send { padding: 6dp; background-color: rgb(236, 244, 251); border: 1dp rgb(176, 206, 232); border-radius: 8dp; }
            /* textarea fills its row exactly (a margin here pushed Send onto the box edge) */
            #game-mail .mail-send > div:nth-child(2) { margin-top: 6dp; min-height: 0dp; }
            #game-mail .mail-send > div:last-child { padding-top: 6dp; padding-bottom: 2dp; }
            #game-mail #send-message {
                box-sizing: border-box;
                background-color: rgb(255, 255, 255);
                border: 1dp rgb(150, 190, 225);
                border-radius: 5dp;
                padding: 4dp 6dp;
                color: rgb(30, 62, 112);
                font-effect: none;
                decorator: none;
            }
            #game-mail #send-button { min-width: 96dp; width: 96dp; height: 28dp; line-height: 28dp; padding: 0dp; }

            /* invisible resize grip; BR flourish in the corner (as Character Preview) */
            #game-mail .window-resize-handle,
            #game-mail .window-resize-handle:hover { decorator: none; z-index: 20; }
            #game-mail .ice-fx.ice-br { right: -7dp; bottom: -30dp; }
        </style>
        <link type="text/rcss" href="../styles/ice_sprites_dark.css" />
        <link type="text/rcss" href="../styles/dark/mail.css" />
    </head>

    <body id="game-mail" template="window-resizeable">
        <tabset id="tabs">
            <tab class="default">Inbox</tab>
            <panel>
                <div style="width: 100%; height: 100%; display: flex; flex-direction: row;" data-model="mail-inbox">
                    <div style="width: 160dp; display: flex; flex-direction:column;" class="content-box mail-list">
                        <div style="display: flex; margin: 4dp; align-items: center; column-gap: 4dp;">
                            <span style="width: 50dp" class="mail-head">Inbox</span>
                            <span style="flex: 1"><label class="text mail-count" data-class-full="inbox.size == inbox_max_size">{{inbox.size}} / {{inbox_max_size}}</label></span>
                        </div>
                        <div style="flex: 1; width: 100%; overflow: hidden auto">
                            <listbox id="inbox" data-event-change="read_mail_index = inbox.size > 0 ? ev.value : 0">
                                <listbox-item data-for="mail, mail_index : inbox" data-attr-value="mail_index" data-class-unread="mail.status == 0">
                                    <span class="from">{{mail.from}}</span><br/>
                                    <span class="timestamp">{{format_mail_timestamp(mail.timestamp)}}</span>
                                </listbox-item>
                            </listbox>
                        </div>
                    </div>

                    <div style="flex: 1; display: flex; flex-direction: column; padding: 5dp" class="content-box mail-read">
                        <table data-if="read_mail_index < inbox.size">
                            <tr>
                                <td style="width: 50dp; vertical-align: middle;">From</td>
                                <td><label class="text">{{read_mail_index < inbox.size ? inbox[read_mail_index].from : ''}}</label></td>
                            </tr>
                            <tr style="padding-top: 2dp">
                                <td style="vertical-align: middle;">Sent</td>
                                <td><label class="text">{{read_mail_index < inbox.size ? format_mail_timestamp(inbox[read_mail_index].timestamp) : ''}}</label></td>
                            </tr>
                        </table>
                        <div style="flex: 1; overflow: hidden auto; margin: 4dp 2dp; word-break: break-word;" id="view-mail-message" data-rml="read_mail_index < inbox.size ? format_mail_message(inbox[read_mail_index].message) : ''"></div>
                        <div data-if="read_mail_index < inbox.size">
                            <div style="display: flex; flex-direction: row">
                                <button class="default" style="min-width: 110dp" data-event-click="start_send_mail(inbox[read_mail_index].from)">Reply</button>
                                <div style="flex: 1"></div>
                                <button class="default mail-delete" style="min-width: 110dp" data-event-click="delete_mail(inbox[read_mail_index].id)" data-attrif-disabled="read_mail_index < inbox.size ? inbox[read_mail_index].deleting : 0">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            </panel>

            <tab class="default">Send</tab>
            <panel data-model="mail-ui">
                <div class="mail-send" style="width: 100%; height: 100%; display: flex; flex-direction: column; box-sizing: border-box;">
                    <div style="display: flex; width: 100%; align-items: center">
                        <span style="padding-right: 10dp" class="mail-to">To</span>
                        <span style="flex: 1;">
                            <input id="send-to" type="text" maxlength="20" style="width: 100%" onchange="change_to" data-attrif-disabled="sending" />
                        </span>
                    </div>
                    <div style="flex: 1;">
                        <textarea id="send-message" style="width: 100%; height: 100%" retains-focus onchange="change_message" data-attrif-disabled="sending"></textarea>
                    </div>
                    <div style="text-align: center; padding-top: 4dp">
                        <button id="send-button" class="default ice-primary" onclick="send_mail" data-attrif-disabled="sending || !valid_message">Send</button>
                    </div>
                </div>
            </panel>
        </tabset>
        <div class="ice-fx ice-tl"></div>
        <div class="ice-fx ice-br"></div>
    </body>
</rml>
