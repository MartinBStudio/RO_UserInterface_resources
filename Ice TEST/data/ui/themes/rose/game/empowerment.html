<rml>
    <head>
        <title>Empowerment</title>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />
        <link type="text/rcss" href="../styles/components.css" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_sprites2.css" />
        <link type="text/rcss" href="../styles/ice_window.css" />
        <style>
            body { width: 340dp; max-width: 92vw; }

            /* ===== ice theme (refine composition) ===== */
            #empowerment .ui-item-row.content-box {
                display: flex; flex-direction: row; align-items: center; column-gap: 8dp;
                margin: 0dp 0dp 5dp 0dp;
                padding: 5dp 8dp;
                background-color: rgb(255, 255, 255);
                border: 1dp rgb(206, 224, 242);
                border-radius: 6dp;
            }
            #empowerment .ice-target.ui-item-row.content-box {
                background-color: rgb(255, 250, 232);
                border-color: rgb(214, 166, 60);
                padding: 7dp 8dp;
            }
            #empowerment .ui-item-caption { color: rgb(120, 140, 170); font-size: 12dp; margin-bottom: 2dp; }
            #empowerment .ui-section-title { color: rgb(30, 62, 112); font-weight: 820; }
            #empowerment .ice-target .ui-section-title { color: rgb(150, 92, 20); font-size: 15dp; }
            #empowerment .ui-item-amount { color: rgb(30, 62, 112); font-weight: 820; font-size: 14dp; }
            #empowerment .ui-footer.content-box { border-top-width: 0dp; padding: 8dp 10dp; margin-bottom: 5dp; }
            #empowerment .ui-detail-row { margin: 2dp 0; font-size: 13dp; color: rgb(90, 115, 150); font-weight: 820; }
            #empowerment .ui-detail-value { color: rgb(190, 130, 20); font-size: 20dp; font-weight: 820; }
            #empowerment .ui-currency {
                padding: 2dp 10dp;
                background-color: rgb(255, 255, 255);
                border: 1dp rgb(206, 224, 242);
                border-radius: 10dp;
                color: rgb(36, 58, 98);
            }
            #empowerment .ui-status { color: rgb(150, 92, 20); font-weight: 820; text-align: center; margin: 2dp 0; }
            #empowerment .ui-actions { margin-top: 2dp; }
            #empowerment .ice-fx.ice-br.small { right: -7dp; }

            /* zulie: close-button style Z icon (atlas2) */
            body img[sprite="ice-zulie-n"] { width: 20dp; min-width: 20dp; height: 20dp; }
            body button.zulie { width: 20dp; min-width: 20dp; height: 20dp; decorator: image(ice-zulie-n); background-color: rgba(0, 0, 0, 0); border-width: 0dp; }
            body button.zulie:hover { decorator: image(ice-zulie-h); }
            body button.zulie:active { decorator: image(ice-zulie-a); }
            body button.zulie:disabled, body button.zulie[disabled] { decorator: image(ice-zulie-n); }
        </style>
    </head>
    <body template="window-fixed-size" id="empowerment">
        <div data-model="empowerment">
            <div class="content-box ui-section ui-item-row ice-target">
                <item-slot id="empowerment-target" class="default" />
                <div class="ui-item-details"><str string-id="1259" class="ui-item-caption" /><span class="ui-section-title">{{target_name}}</span></div>
            </div>
            <div class="content-box ui-section ui-item-row" data-if="materials[0].required">
                <item-slot id="empowerment-material-0" class="default" />
                <div class="ui-item-details"><str string-id="1260" class="ui-item-caption" /><span class="ui-section-title">{{materials[0].name}}</span></div><span class="ui-item-amount">{{materials[0].count}}</span>
            </div>
            <div class="content-box ui-section ui-item-row" data-if="materials[1].required">
                <item-slot id="empowerment-material-1" class="default" />
                <div class="ui-item-details"><str string-id="1260" class="ui-item-caption" /><span class="ui-section-title">{{materials[1].name}}</span></div><span class="ui-item-amount">{{materials[1].count}}</span>
            </div>
            <div class="content-box ui-section ui-item-row" data-if="materials[2].required">
                <item-slot id="empowerment-material-2" class="default" />
                <div class="ui-item-details"><str string-id="1260" class="ui-item-caption" /><span class="ui-section-title">{{materials[2].name}}</span></div><span class="ui-item-amount">{{materials[2].count}}</span>
            </div>
            <div class="content-box ui-section ui-item-row" data-if="materials[3].required">
                <item-slot id="empowerment-material-3" class="default" />
                <div class="ui-item-details"><str string-id="1260" class="ui-item-caption" /><span class="ui-section-title">{{materials[3].name}}</span></div><span class="ui-item-amount">{{materials[3].count}}</span>
            </div>
            <div class="content-box ui-section ui-item-row" data-if="materials[4].required">
                <item-slot id="empowerment-enhancer" class="default" />
                <div class="ui-item-details"><str string-id="1302" class="ui-item-caption" /><span class="ui-section-title">{{materials[4].name}}</span></div><span class="ui-item-amount">{{materials[4].count}}</span>
            </div>
            <div class="content-box ui-section ui-item-row" data-if="ready">
                <item-slot id="empowerment-next" class="default" />
                <div class="ui-item-details"><str string-id="1261" class="ui-item-caption" /><span class="ui-section-title">{{next_name}}</span></div>
            </div>
            <div class="ui-footer content-box">
                <div class="ui-detail-row" data-if="ready"><str string-id="318" /><span class="ui-detail-value" id="empowerment-chance">{{chance}}</span></div>
                <div class="ui-detail-row"><str string-id="574" /><div class="ui-currency"><img id="empowerment-currency" sprite="ice-zulie-n" /><span id="empowerment-cost">{{cost}}</span></div></div>
            </div>
            <span id="empowerment-status" class="ui-status ui-operation-status" data-if="status != ''">{{status}}</span>
            <div class="ui-actions ui-operation-actions"><button id="empowerment-begin" class="default accept ice-primary" onclick="begin" data-attrif-disabled="busy"><str string-id="1262" /></button></div>
        </div>
        <div class="ice-fx ice-tl small"></div>
        <div class="ice-fx ice-br small"></div>
    </body>
</rml>
