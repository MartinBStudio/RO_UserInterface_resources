<rml>
    <head>
        <title>Refine</title>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />
        <link type="text/rcss" href="../styles/components.css" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_sprites2.css" />
        <link type="text/rcss" href="../styles/ice_window.css" />
        <style>
            body { width: 340dp; max-width: 92vw; }

            /* ===== ice theme (Game Arena composition) ===== */
            #refine .rf-root { display: flex; flex-direction: column; row-gap: 6dp; }

            /* white cards; the item being refined gets a gold edge */
            #refine .ui-item-row.content-box {
                display: flex; flex-direction: row; align-items: center; column-gap: 8dp;
                margin: 0;
                padding: 5dp 8dp;
                background-color: rgb(255, 255, 255);
                border: 1dp rgb(206, 224, 242);
                border-radius: 6dp;
            }
            #refine .rf-target.ui-item-row.content-box {
                background-color: rgb(255, 250, 232);
                border-color: rgb(214, 166, 60);
                padding: 7dp 8dp;
            }
            #refine .rf-mats.content-box { display: flex; flex-direction: column; row-gap: 4dp; padding: 6dp; }
            #refine .ui-item-caption { color: rgb(120, 140, 170); font-size: 12dp; margin-bottom: 2dp; }
            #refine .ui-section-title { color: rgb(30, 62, 112); font-weight: 820; }
            #refine .rf-target .ui-section-title { color: rgb(150, 92, 20); font-size: 15dp; }
            #refine .ui-item-amount { color: rgb(30, 62, 112); font-weight: 820; font-size: 14dp; }

            /* chance + cost */
            #refine .ui-footer.content-box { border-top-width: 0dp; padding: 8dp 10dp; }
            #refine .ui-detail-row { margin: 2dp 0; font-size: 13dp; color: rgb(90, 115, 150); font-weight: 820; }
            #refine #refine-chance { color: rgb(190, 130, 20); font-size: 20dp; font-weight: 820; }
            #refine .ui-currency {
                padding: 2dp 10dp;
                background-color: rgb(255, 255, 255);
                border: 1dp rgb(206, 224, 242);
                border-radius: 10dp;
                color: rgb(36, 58, 98);
            }
            #refine .ui-currency.mana { color: rgb(20, 120, 190); }

            #refine #refine-status { color: rgb(150, 92, 20); font-weight: 820; text-align: center; margin: 2dp 0; }
            #refine .ui-actions { margin-top: 2dp; }
            #refine .ice-fx.ice-br.small { right: -7dp; }
        
            /* zulie: close-button style Z icon (atlas2) */
            body img[sprite="ice-zulie-n"] { width: 20dp; min-width: 20dp; height: 20dp; }
            body button.zulie { width: 20dp; min-width: 20dp; height: 20dp; decorator: image(ice-zulie-n); background-color: rgba(0, 0, 0, 0); border-width: 0dp; }
            body button.zulie:hover { decorator: image(ice-zulie-h); }
            body button.zulie:active { decorator: image(ice-zulie-a); }
            body button.zulie:disabled, body button.zulie[disabled] { decorator: image(ice-zulie-n); }
        </style>
        <link type="text/rcss" href="../styles/ice_sprites_dark.css" />
        <link type="text/rcss" href="../styles/dark/refine.css" />
    </head>
    <body template="window-fixed-size" id="refine">
        <div data-model="refine" class="rf-root">
            <div class="content-box ui-section ui-item-row rf-target">
                <item-slot id="refine-target" class="default" />
                <div class="ui-item-details"><str string-id="788" class="ui-item-caption" /><span class="ui-section-title">{{target_name}}</span></div>
            </div>
            <div class="content-box rf-mats">
                <div class="content-box ui-section ui-item-row">
                    <item-slot id="refine-material-0" class="default" />
                    <div class="ui-item-details"><str string-id="798" class="ui-item-caption" /><span class="ui-section-title">{{material0}}</span></div><span class="ui-item-amount">{{count[0]}}</span>
                </div>
                <div class="content-box ui-section ui-item-row">
                    <item-slot id="refine-material-1" class="default" />
                    <div class="ui-item-details"><str string-id="465" class="ui-section-title" /></div><span class="ui-item-amount">{{count[1]}}</span>
                </div>
                <div class="content-box ui-section ui-item-row">
                    <item-slot id="refine-material-2" class="default" />
                    <div class="ui-item-details"><str string-id="466" class="ui-section-title" /></div><span class="ui-item-amount">{{count[2]}}</span>
                </div>
                <div class="content-box ui-section ui-item-row">
                    <item-slot id="refine-material-3" class="default" />
                    <div class="ui-item-details"><str string-id="467" class="ui-section-title" /></div><span class="ui-item-amount">{{count[3]}}</span>
                </div>
            </div>
            <div class="ui-footer content-box">
                <div class="ui-detail-row"><str string-id="318" /><span class="ui-detail-value" id="refine-chance">{{chance}}</span></div>
                <div class="ui-detail-row"><span>{{cost_label}}</span><div class="ui-currency" data-class-mana="uses_mp"><img id="refine-currency" sprite="ice-zulie-n" data-if="!uses_mp" /><span id="refine-cost">{{cost}}</span></div></div>
            </div>
            <span id="refine-status" class="ui-status ui-operation-status" data-if="status != ''">{{status}}</span>
            <div class="ui-actions ui-operation-actions"><button id="refine-begin" class="default accept ice-primary" onclick="begin" data-attrif-disabled="busy"><str string-id="895" /></button></div>
            <div class="ice-fx ice-tl small"></div>
            <div class="ice-fx ice-br small"></div>
        </div>
    </body>
</rml>
