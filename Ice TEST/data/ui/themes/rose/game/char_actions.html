<rml>
    <head>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_window.css" />

        <style>
            body
            {
                width: 200dp;
                height: auto;
                font-effect: outline(1dp black);
            }

            button {
                width: 100%;
            }

            /* ===== ice theme ===== */
            #game-character-actions #window-content { overflow: visible; }
            #game-character-actions .ca-box { display: flex; flex-direction: column; gap: 5dp; padding: 7dp; }
            #game-character-actions .ca-box button.default { margin: 0; }
            #game-character-actions .window-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 34dp; }
            /* close is a span here, not a button: give it the ice X */
            #game-character-actions span.window-title-close {
                position: absolute; top: 7dp; right: 8dp; z-index: 20;
                width: 24dp; height: 24dp;
                decorator: image(ice-close-n);
                cursor: hand;
            }
            #game-character-actions span.window-title-close:hover { decorator: image(ice-close-h); }
            #game-character-actions span.window-title-close:active { decorator: image(ice-close-a); }
        </style>
        <link type="text/rcss" href="../styles/ice_sprites_dark.css" />
        <link type="text/rcss" href="../styles/dark/char_actions.css" />
    </head>

    <body id="game-character-actions" data-model="character-actions" class="window-fixed-size">
        <handle class="window-title" move_target="#document" id="window-title-text">{{name}}</handle>
        <span class="window-title-close" onclick="close"></span>

        <div id="window-content">
          <div class="ice-box ca-box">
            <button class="default" onclick="friend">
                <str string-id="883">Add Friend</str>
            </button>

            <button class="default" onclick="party">
                <str string-id="27">Party</str>
            </button>

            <button class="default" onclick="group" data-if="group == true">
                <str string-id="253">Group</str>
            </button>

            <button class="default" data-if="group == false" disabled>
                <str string-id="253">Group</str>
            </button>

            <button class="default" onclick="trade">
                <str string-id="1429">Trade</str>
            </button>

            <button class="default" onclick="duel">
                <str string-id="1432">Duel</str>
            </button>

            <button class="default" onclick="whisper">
                <str string-id="342">Whisper</str>
            </button>

            <button class="default" onclick="ride" data-if="ride == true">
                <str string-id="1430">Ride Invite</str>
            </button>

            <button class="default" data-if="ride == false" disabled>
                <str string-id="1430">Ride Invite</str>
            </button>
          </div>
          <div class="ice-fx ice-tl small"></div>
          <div class="ice-fx ice-br small"></div>
        </div>
    </body>
</rml>
