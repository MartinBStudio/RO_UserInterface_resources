<rml>
    <head>
        <title>Private Chat</title>

        <link type="text/template" href="../templates/window-resizeable.html" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_window.css" />

        <style>
            #game-private-chat
            {
                width: 240dp;
                height: 220dp;
                min-width: 190dp;
                min-height: 130dp;
            }

            #game-private-chat #window-content { padding: 8dp; }

            /* light ice-blue box, same as the other windows */
            #game-private-chat .pc-box
            {
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                box-sizing: border-box;
                padding: 6dp 2dp 6dp 8dp;
                background-color: rgb(236, 244, 251);
                border: 1dp rgb(176, 206, 232);
                border-radius: 8dp;
            }

            #virtual-messages
            {
                display: block;
                flex: 1;
                padding-right: 4dp;
                word-break: break-word;
                color: rgb(30, 62, 112);
                font-effect: none;
                overflow: hidden scroll;
            }

            .chat-message { margin: 0dp 0dp; }
            .chat-message-from:hover { text-decoration: underline; }
            .chat-message-link:hover { text-decoration: underline; }
            .timestamp { color: rgb(120, 140, 170); }
            .chat-message-chat { color: rgb(30, 62, 112); }
            .chat-message-whisper { color: rgb(196, 60, 140); }

            /* input: standard white ice field (colours from ice_window.css) */
            #game-private-chat input[type="text"]
            {
                margin: 6dp 6dp 0dp 0dp;
                height: 26dp;
                box-sizing: border-box;
                padding: 3dp 6dp;
                line-height: 18dp;
            }

            /* resize grip stays usable but invisible, the flourish covers the corner */
            #game-private-chat .window-resize-handle,
            #game-private-chat .window-resize-handle:hover { decorator: none; z-index: 20; }

            /* resizeable frame has a taller bottom edge */
            #game-private-chat .ice-fx.ice-br { right: -7dp; bottom: -32dp; }
        </style>
        <link type="text/rcss" href="../styles/ice_sprites_dark.css" />
        <link type="text/rcss" href="../styles/dark/private_chat.css" />
    </head>

    <body id="game-private-chat" template="window-resizeable">
        <div class="pc-box">
            <virtual-list-box id="virtual-messages"></virtual-list-box>
            <input id="input_text" type="text" maxlength="250" retains-focus autofocus />
        </div>
        <div class="ice-fx ice-tl"></div>
        <div class="ice-fx ice-br"></div>
    </body>
</rml>
