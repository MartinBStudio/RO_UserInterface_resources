<rml>
    <head>
        <title>World Map</title>

        <link type="text/template" href="../templates/window-resizeable.html" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_window.css" />

        <style>
            body {
                width: 640dp;
                height: 480dp;
            }

            #zone-list {
                display: inline-block;
                width: 200dp;
                height: 100%;
            }

            listbox-item {
                padding: 2dp;
                padding-left: 10dp;
            }

            .zone-description {
                color: #aaa;
            }

            #map-container {
                height: 100%;
                overflow: hidden;
                clip: always;
            }

            #zoom-control {
                position: absolute;
                bottom: 5dp;
                right: 5dp;
                font-effect: outline(1dp black);
            }

            #zoom-control > input {
                width: 100dp;
                vertical-align: middle;
            }

            /* ===== ice theme ===== */
            #game-world-map #window-content { padding: 6dp; }

            /* zone list: ice box, white zone cards, the zone on screen = gold */
            #game-world-map #zone-list { padding: 4dp; box-sizing: border-box; }
            #game-world-map details > summary { font-weight: 820; padding: 2dp 0dp; }
            #game-world-map listbox-item.zone {
                display: block;
                padding: 3dp 6dp 3dp 8dp;
                margin: 0dp 2dp 3dp 0dp;
                background-color: rgb(255, 255, 255);
                border: 1dp rgb(206, 224, 242);
                border-radius: 6dp;
                color: rgb(36, 58, 98);
            }
            #game-world-map listbox-item.zone:hover {
                background-color: rgb(240, 247, 255);
                border-color: rgb(120, 175, 225);
            }
            #game-world-map listbox-item.zone.shown,
            #game-world-map listbox-item.zone.shown:hover {
                background-color: rgb(255, 246, 214);
                border-color: rgb(214, 166, 60);
            }
            #game-world-map .zone-name { font-weight: 820; font-size: 13dp; }
            #game-world-map .zone-here .zone-name { color: rgb(170, 100, 20); }
            #game-world-map .zone-description { color: rgb(98, 124, 156); font-size: 11dp; }

            /* map area: navy backdrop with an ice edge */
            #game-world-map #map-container {
                background-color: rgb(20, 36, 62);
                border: 1dp rgb(176, 206, 232);
            }

            /* list toggle: MINUS = orange, PLUS = green */
            #game-world-map #map-container > button.minus,
            #game-world-map #map-container > button.plus {
                width: 22dp; min-width: 22dp; height: 22dp;
            }
            #game-world-map #map-container > button.minus { decorator: image(ice-min-n); }
            #game-world-map #map-container > button.minus:hover { decorator: image(ice-min-h); }
            #game-world-map #map-container > button.minus:active { decorator: image(ice-min-a); }
            #game-world-map #map-container > button.plus { decorator: image(ice-learn-n); }
            #game-world-map #map-container > button.plus:hover { decorator: image(ice-learn-h); }
            #game-world-map #map-container > button.plus:active { decorator: image(ice-learn-a); }

            /* zoom: navy pill, sideways ice slider, ice close button as reset */
            #game-world-map #zoom-control {
                bottom: 8dp; right: 8dp;
                padding: 3dp 6dp 3dp 10dp;
                background-color: rgba(14, 32, 62, 190);
                border: 1dp rgb(176, 206, 232);
                border-radius: 12dp;
                color: rgb(255, 255, 255);
                font-weight: 820;
                font-effect: outline(1dp rgb(10, 20, 40));
                z-index: 2;
            }
            #game-world-map #zoom-control > input[type="range"] { height: 14dp; margin: 0dp 6dp; }
            #game-world-map #zoom-control > input[type="range"] slidertrack {
                decorator: tiled-horizontal(ice-htrack-l, ice-htrack-c, ice-htrack-r);
                background-color: rgba(0, 0, 0, 0);
                border-width: 0dp;
                height: 8dp;
                margin-top: 3dp;
            }
            #game-world-map #zoom-control > input[type="range"] sliderbar {
                decorator: tiled-horizontal(ice-hbar-l, ice-hbar-c, ice-hbar-r);
                background-color: rgba(0, 0, 0, 0);
                border-width: 0dp;
                width: 24dp;
                height: 12dp;
                margin-top: 1dp;
            }
            #game-world-map #zoom-control > input[type="range"] sliderbar:hover,
            #game-world-map #zoom-control > input[type="range"] sliderbar:active {
                decorator: tiled-horizontal(ice-hbar-hover-l, ice-hbar-hover-c, ice-hbar-hover-r);
            }
            #game-world-map #zoom-control > input[type="range"] sliderarrowdec,
            #game-world-map #zoom-control > input[type="range"] sliderarrowinc { width: 0dp; height: 0dp; decorator: none; }
            #game-world-map #zoom-control > button.close {
                width: 18dp; min-width: 18dp; height: 18dp;
                vertical-align: middle;
                decorator: image(ice-close-n);
            }
            #game-world-map #zoom-control > button.close:hover { decorator: image(ice-close-h); }
            #game-world-map #zoom-control > button.close:active { decorator: image(ice-close-a); }

            /* resize grip stays usable but invisible, the flourish covers the corner */
            #game-world-map .window-resize-handle,
            #game-world-map .window-resize-handle:hover { decorator: none; z-index: 20; }
            #game-world-map .ice-fx.ice-br { right: -7dp; bottom: -32dp; }
        </style>
        <link type="text/rcss" href="../styles/ice_sprites_dark.css" />
        <link type="text/rcss" href="../styles/dark/world_map.css" />
    </head>

    <body id="game-world-map" template="window-resizeable">
        <div data-model="world-map" style="width: 100%; height: 100%">
            <div style="display: flex; flex-direction: row; column-gap: 4dp;">
                <div class="content-box" id="zone-list" data-if="show_zone_list">
                    <listbox style="overflow: hidden scroll; height: 100%">
                        <details
                            data-for="zone_group, zone_group_index : zone_groups"
                            data-attr-id="'group-' + zone_group_index"
                        >
                            <summary>{{zone_group.name}}</summary>
                            <div> <!-- wrapped in a div to avoid conflict with <details> and data-if -->
                                <listbox-item
                                    data-for="zone_id : zone_group.zone_ids"
                                    data-attr-id="'zone-' + zone_id"
                                    data-event-click="show_zone(zone_id)"
                                    data-if="zone_info[zone_id].visible || player.zone_id == zone_id"
                                    class="zone"
                                    data-class-shown="loaded_map.zone_id == zone_id"
                                    data-class-zone-here="player.zone_id == zone_id"
                                >
                                    <div class="zone-name">{{zone_info[zone_id].name}}</div>
                                    <div class="zone-description">{{zone_info[zone_id].description}}</div>
                                </listbox-item>
                            </div>
                        </details>
                    </listbox>
                </div>

                <div style="flex: 1;" id="map-container">
                    <div id="map">
                        <img
                            id="map-image"
                            data-if="loaded_map.zone_id != 0"
                            data-attr-src="zone_info[loaded_map.zone_id].map_src"
                            data-attr-width="round(loaded_map.map_image_size.x * zoom_level) + 'dp'"
                            data-attr-height="round(loaded_map.map_image_size.y * zoom_level) + 'dp'"
                            data-event-mousedown="click_map"
                            style="position: absolute;"
                        >
                        </img>

                        <img
                            data-for="npc : zone_info[loaded_map.zone_id].npcs"
                            data-style-left="round(zoom_level * npc.map_position.x) + 'dp'"
                            data-style-top="round(zoom_level * npc.map_position.y) + 'dp'"
                            data-attr-sprite="npc.icon_sprite"
                            data-attr-npc_id="npc.npc_id"
                            data-attr-quest_signal="npc.quest_signal"
                            data-event-mousedown="click_npc(npc.npc_id, npc.world_position.x, npc.world_position.y)"
                            style="position: absolute; transform: translate(-50%, -50%);"
                        >
                        </img>

                        <img
                            data-for="party_member : party_members"
                            data-if="party_member.zone_id == loaded_map.zone_id"
                            data-style-left="round(zoom_level * party_member.map_position.x) + 'dp'"
                            data-style-top="round(zoom_level * party_member.map_position.y) + 'dp'"
                            data-attr-name="party_member.name"
                            sprite="map-party-member"
                            style="position: absolute; transform: translate(-50%, -50%);"
                        >
                        </img>

                        <img
                            data-if="player.zone_id == loaded_map.zone_id"
                            src="/3DData/Control/Res/MiniMap_Arrow.tga"
                            data-style-left="round(zoom_level * player.map_position.x) + 'dp'"
                            data-style-top="round(zoom_level * player.map_position.y) + 'dp'"
                            data-style-transform="'translate(-50%, -50%) rotate(' + player.direction + ' rad)'"
                            data-event-mousedown="click_player"
                            style="position: absolute;"
                        >
                        </img>

                        <img
                            data-for="marker : markers"
                            data-style-left="round(zoom_level * marker.map_position.x) + 'dp'"
                            data-style-top="round(zoom_level * marker.map_position.y) + 'dp'"
                            data-attr-sprite="marker.sprite"
                            style="position: absolute; transform: translate(-50%, -50%); pointer-events: none;"
                        >
                        </img>
                    </div>

                    <button data-attr-class="show_zone_list ? 'minus' : 'plus'" style="margin: 0dp; z-index: 1" data-event-click="show_zone_list = !show_zone_list" />
                </div>
            </div>

            <div id="zoom-control">
                {{zoom_percent + '%'}}
                <input type="range" min="20" max="500" data-value="zoom_percent" data-event-change="zoom_percent_changed()" ondblclick="zoom-reset" />
                <button class="close" onclick="zoom-reset" />
            </div>
        </div>
        <div class="ice-fx ice-tl"></div>
        <div class="ice-fx ice-br"></div>
    </body>
</rml>
