        <style>
            body { width: 267dp; max-width: 95vw; }
            #inventory-window #window-content { padding: 6dp; max-height: none; overflow: visible; }
            #inventory-window > .window-title { width: 76dp; font-size: 13dp; }
            .inventory-mode-tabs { display: flex; position: absolute; top: 2dp; right: 30dp; width: 164dp; height: 23dp; z-index: 1; }
            .inventory-mode-tabs > .inventory-tab { height: 23dp; line-height: 19dp; padding: 1dp 2dp; font-size: 12dp; background-color: transparent; border: 0dp transparent; border-bottom: 2dp transparent; border-radius: 0dp; }
            .inventory-mode-tabs > .inventory-tab:hover { background-color: rgba(85, 40, 34, 100); }
            .inventory-mode-tabs > .inventory-tab.selected { border-bottom-color: rgb(190, 64, 53); }
            .inventory-bag-label { flex: 1; height: 24dp; line-height: 24dp; padding-left: 4dp; font-size: 13dp; font-weight: 820; color: rgb(255, 112, 102); }
            .equipment-pane { position: relative; width: 255dp; height: 133dp; margin: 0 auto 4dp; }
            /* Align the 40dp slots with the bag while retaining the padded equipment artwork. */
            .equipment-cell { position: absolute; width: 40dp; height: 43dp; }
            .equipment-cell > img { position: absolute; left: -2dp; width: 43dp; height: 43dp; pointer-events: none; }
            .equipment-cell item-slot { position: absolute; top: 2dp; left: 0dp; width: 40dp; height: 40dp; }
            .equipment-cell.filled > img { visibility: hidden; }
            /* Explicit six-slot rows keep fractional UI scales from wrapping a column. */
            .bag-grid { width: 100%; flex-direction: column; flex-wrap: nowrap; gap: 3dp; }
            .bag-row { display: flex; flex-wrap: nowrap; gap: 3dp; }
            .bag-row > .bag-cell { width: 40dp; height: 40dp; flex: 0 0 40dp; }
            .inventory-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4dp; margin-top: 4dp; padding-top: 4dp; padding-right: 2dp; padding-bottom: 2dp; }
            .inventory-footer .ui-currency { flex-shrink: 0; font-size: 12dp; }
            .inventory-footer .ui-currency > img, .inventory-footer .ui-currency > button.zulie { position: relative; top: 1dp; }
            .inventory-footer .ui-currency > span { position: relative; top: 2dp; white-space: nowrap; word-break: normal; }
            #inventory-zulie { margin-left: auto; }
            #inventory-weight { color: rgb(0, 210, 255); }
            #inventory-weight.overweight { color: rgb(255, 100, 100); }
            .vehicle-stats { position: absolute; top: 49dp; left: 0; right: 0; font-size: 12dp; }
            .vehicle-stat { display: inline-flex; justify-content: space-between; width: 48%; margin-right: 2%; line-height: 19dp; }
            .vehicle-stat span { color: rgb(255, 247, 191); }
            #inventory-operation { color: rgb(255, 247, 191); font-size: 12dp; margin-bottom: 8dp; }
        </style>
